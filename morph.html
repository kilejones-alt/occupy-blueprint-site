<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleeping bag to keffiyeh</title>
<style>
html{color-scheme:dark;background:#040405;color:#f3f5f8;font:14px system-ui}
body{margin:0;min-height:100svh}
.stage{position:fixed;bottom:clamp(24px,7vw,96px);right:clamp(24px,7vw,96px);width:clamp(145px,21vw,290px);aspect-ratio:1;isolation:isolate}
.cloth,.lining,.embers{position:absolute;inset:0}
.cloth{clip-path:polygon(31% 10%,58% 7%,67% 17%,70% 78%,63% 91%,31% 92%,23% 81%,23% 22%);background:repeating-linear-gradient(0deg,#38492e 0 15px,#293b26 16px 17px);transform:rotate(-17deg);animation:cloth 15s ease-in-out both}
.cloth::after{content:"";position:absolute;inset:0;opacity:0;background:repeating-linear-gradient(45deg,transparent 0 5px,#1b1b1c 5px 7px,transparent 7px 11px),repeating-linear-gradient(-45deg,#d8d7d1 0 5px,#262627 5px 7px,#d8d7d1 7px 11px);box-shadow:inset 0 0 0 13px #d8d7d1,inset 0 0 0 18px #18181a;animation:weave 15s ease both}
.lining{inset:13% 38% 68% 28%;border-radius:60% 58% 44% 45%;background:radial-gradient(ellipse at 50% 70%,#39281c,#78563e 78%);transform:translate(-8%,1%) rotate(-17deg);animation:lining 15s both}
.embers{inset:16%;pointer-events:none;background:radial-gradient(ellipse at 32% 80%,#e47121a0,transparent 35%),radial-gradient(ellipse at 70% 65%,#a72b19aa,transparent 38%);filter:blur(11px);mix-blend-mode:screen;animation:heat 15s both}
.embers i{position:absolute;left:var(--x);bottom:15%;width:3px;height:3px;border-radius:50%;background:#f6a15f;box-shadow:0 0 7px #ff561a;animation:spark 2s var(--delay) ease-out 3 both}
button{position:absolute;right:0;top:100%;border:0;background:none;color:inherit;padding:8px 0;text-decoration:underline;text-underline-offset:.25em;cursor:pointer}
@keyframes cloth{0%,23%{transform:rotate(-17deg)}42%{filter:brightness(.72)}83%,100%{clip-path:polygon(9% 21%,38% 12%,66% 16%,92% 32%,84% 55%,73% 83%,51% 91%,20% 67%);transform:rotate(10deg);filter:none}}
@keyframes lining{0%,23%{opacity:1}53%,100%{opacity:0}}
@keyframes weave{0%,31%{opacity:0}77%,100%{opacity:1}}
@keyframes heat{0%,19%,78%,100%{opacity:0}38%,54%{opacity:1}}
@keyframes spark{0%{opacity:0;transform:translateY(0)}24%{opacity:.9}100%{opacity:0;transform:translate(14px,-100px)}}
@media(prefers-reduced-motion:reduce){.stage *{animation-duration:1ms!important;animation-delay:0ms!important}}
</style>
<main>
<figure class="stage" aria-label="A green sleeping bag with brown lining smolders, then unfolds into a black-and-white keffiyeh">
<div class="cloth"></div><div class="lining"></div><div class="embers"><i style="--x:29%;--delay:3.4s"></i><i style="--x:47%;--delay:4.1s"></i><i style="--x:62%;--delay:4.8s"></i><i style="--x:72%;--delay:5.4s"></i></div>
<button type="button">Replay</button>
</figure>
</main>
<script>
const stage = document.querySelector('.stage');
stage.addEventListener('click', event => {
  if (event.target.tagName !== 'BUTTON') return;
  stage.querySelectorAll('.cloth,.lining,.embers,.embers i').forEach(layer => {
    layer.getAnimations().forEach(animation => {
      animation.currentTime = 0;
      animation.play();
    });
  });
});
</script>
</html>
