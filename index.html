<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Occupy Blueprint — Tali Gillette</title>
<style>
:root{color-scheme:dark;--ink:#040405;--paper:#f3f5f8;--oxblood:#a51d33;--gutter:clamp(20px,5vw,90px);--x:0px;--y:0px;--scroll:0px}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:system-ui,sans-serif}
main{overflow:clip;min-height:125svh;display:grid;align-content:start;position:relative;isolation:isolate;padding-block:clamp(40px,8vh,100px) clamp(80px,12vh,160px)}
.hero,.statement{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));padding-inline:var(--gutter);position:relative;isolation:isolate}
.hero{position:static;align-content:center}
h1,p,figure{margin:0}
h1{grid-column:1/-1;display:grid;grid-template-columns:subgrid;line-height:1}
.frame{display:block;overflow:hidden}
.occupy{grid-column:1/11;width:min(100%,1100px);mix-blend-mode:screen}
.the{grid-column:1/-1;margin-bottom:clamp(12px,1.6vw,24px);font-size:clamp(18px,2vw,32px);font-weight:500;letter-spacing:.24em;color:#fff}
.occupy .word{display:block;aspect-ratio:1288/408;background:url(cover.webp) 50.5% 27.25% / 129.81% auto no-repeat;filter:grayscale(1) brightness(1.18) contrast(1.23);mix-blend-mode:screen}
.blueprint{grid-column:1/-1;margin-top:clamp(8px,1.3vw,24px);color:#fff;font-size:clamp(36px,10vw,160px);font-weight:650;letter-spacing:-.065em}
.credit{grid-column:1/-1;margin-top:clamp(15px,2.4vw,36px);font:400 clamp(11px,1.2vw,17px)/1.5 ui-monospace,monospace;letter-spacing:.085em;text-transform:uppercase;color:#d1d8e0}
.night{position:absolute;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;opacity:.84;filter:blur(1.2px);mask-image:linear-gradient(#0000 2%,#000 36%);transform-origin:0 50%;transform:translate3d(calc(8vw + var(--x)),calc(var(--y) + var(--scroll)),0) scale(1.375);will-change:transform}
.street{position:absolute;z-index:-1;inset:8% 0 auto auto;width:32%;height:75%;overflow:hidden;opacity:.24;mask-image:linear-gradient(90deg,transparent,#000 72%)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 8% 17% at 86% 19%,#cbd7e016,transparent 85%),radial-gradient(ellipse 15% 21% at 96% 45%,#e0d1bc13,transparent 85%),radial-gradient(ellipse 11% 24% at 74% 60%,#abbccb0d,transparent 90%)}
.street::after,.opening::after{content:"";position:absolute;inset:-12%;background:url(cover.webp) right center / auto 420% no-repeat;filter:grayscale(1) brightness(1.4) blur(1.2px);transform:translate3d(var(--x),calc(var(--y) + var(--scroll)),0)}
.opening{position:absolute;inset:0 0 auto;height:100svh;overflow:hidden;pointer-events:none;background:var(--ink);z-index:2;animation:fade 5.4s .15s both;mask-image:linear-gradient(90deg,#000 77%,transparent)}
.opening::after{background-size:auto 360%;background-position:100% 55%;opacity:.8}
.statement{align-content:center;margin-top:clamp(24px,5.2svh,58px)}
.tagline{grid-column:1/-1;font-size:clamp(26px,4.5vw,72px);font-weight:480;letter-spacing:-.045em;word-spacing:.09em;line-height:1.16}
.second-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 .24em;margin-top:.12em}.tagline .token{vertical-align:baseline}.tagline strong{color:var(--oxblood);font-weight:inherit;white-space:nowrap;display:inline-block}.tagline strong .token{vertical-align:baseline}
.token{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.09em}
.word{display:inline-block;transition:filter 1.45s ease,color 1.45s ease,text-shadow 1.45s ease}
@media(hover:hover){.word:hover{color:#fff;filter:brightness(1.16);text-shadow:0 0 .5em #e1edff45}.tagline strong .word:hover{color:#cf3852;text-shadow:0 0 .45em #d36b8045}.occupy .word:hover{filter:grayscale(1) brightness(1.24) contrast(1.15)}}
.run .word{animation:roll 1.22s cubic-bezier(.22,.71,.18,1) var(--at,0s) both}
.statement-inner{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-column:1/-1}
.run .tagline .word{animation:wave 1.9s cubic-bezier(.16,.75,.22,1) var(--at) both}
@keyframes wave{0%{transform:translate3d(0,-105%,0) rotateX(18deg);filter:blur(7px);opacity:.15}55%{filter:blur(1.5px);opacity:1}100%{transform:translate3d(0,0,0) rotateX(0);filter:blur(0);opacity:1}}
.run .tagline strong .word{animation-duration:1.8s}
a{grid-column:1/-1;justify-self:start;margin-top:clamp(13px,2.7svh,32px);color:inherit;position:relative;text-decoration:none;font:400 14px ui-monospace,monospace}
a::after{content:"";position:absolute;inset:auto 0 -.35em;height:1px;background:currentColor;transform-origin:left}
.js a{animation:roll .8s 13.3s both}.js a::after{animation:underline 2.1s 13.6s cubic-bezier(.2,.65,.3,1) both}@keyframes underline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
a:focus-visible{outline:1px solid currentColor;outline-offset:.55em}
@keyframes roll{from{transform:translate3d(0,-105%,0);opacity:.1}to{transform:translate3d(0,0,0);opacity:1}}
@keyframes fade{0%,11%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(max-width:650px){.occupy{grid-column:1/-1}.blueprint{font-size:11.4vw}.street{width:46%}}
@media(prefers-reduced-motion:reduce){.opening{display:none}.run .word{animation:none}.street::after{transform:none}.js a,.js a::after{animation:none}}
</style>
</head>
<body>
<main>
<canvas class="night" aria-hidden="true"></canvas>
<section class="hero run" aria-label="The Occupy Blueprint">
<div class="opening" aria-hidden="true"></div>
<figure class="street" aria-hidden="true"></figure>
<h1 aria-label="The Occupy Blueprint"><span class="frame the"><span class="word" style="--at:3s">THE</span></span><span class="frame occupy" aria-hidden="true"><span class="word" style="--at:3.6s"></span></span><span class="frame blueprint"><span class="word" style="--at:5.1s">BLUEPRINT</span></span></h1>
<p class="credit" data-delay="6.25">By Tali Gillette</p>
</section>
<section class="statement run" aria-label="Tagline"><div class="statement-inner">
<p class="tagline"><span data-delay="8.1" data-step=".31">They didn’t just occupy Wall Street.</span><span class="second-line"><span data-delay="9.35" data-step=".33">They occupied</span> <strong data-delay="10.35" data-step=".57" data-letters>U.S.</strong></span></p>
<a href="https://taligillette.substack.com/">Substack</a></div>
</section>
</main>
<script>
const canvas = document.querySelector('.night');
const photograph = new Image();
photograph.onload = () => {
  const context = canvas.getContext('2d');
  if (!context) return;
  const w = canvas.width = 720;
  const h = canvas.height = 480;
  function paintPhotograph() {
    context.save();
    context.translate(w / 2, h / 2);
    context.rotate(-Math.PI / 2);
    context.beginPath();
    context.moveTo(-h / 2, -w / 2);
    context.lineTo(h / 2, -w / 2);
    for (const [x, y] of [[1,.30],[.8,.40],[.65,.48],[.5,.54],[.35,.57],[0,.57]]) {
      context.lineTo((x - .5) * h, (y - .5) * w);
    }
    context.closePath();
    context.clip();
    context.drawImage(photograph, -h / 2, -w / 2, h, w);
    context.restore();
  }
  paintPhotograph();
  const pixels = context.getImageData(0, 0, w, h).data;
  context.clearRect(0, 0, w, h);

  const lights = [];
  for (let y = 2; y < h; y += 3) {
    for (let x = 2; x < w; x += 3) {
      const i = (y * w + x) * 4;
      const [r, g, b] = [pixels[i], pixels[i + 1], pixels[i + 2]];
      const intensity = .3 * r + .59 * g + .11 * b;
      if (intensity < 70) continue;
      const distance = Math.hypot((x - w * .65) * .85, y - h * .69);
      const offset = ((x * 47 + y * 31) % 61) - 30;
      lights.push({x, y, r, g, b, intensity, order: distance + offset});
    }
  }
  lights.sort((a, b) => a.order - b.order);
  function draw(progress) {
    context.clearRect(0, 0, w, h);
    const count = lights.length;
    for (let index = 0; index < count; index++) {
      const onset = index / count * .94;
      const fade = Math.min(1, Math.max(0, (progress - onset) / .06));
      if (fade <= 0) break;
      const {x, y, r, g, b, intensity} = lights[index];
      const opacity = fade * fade * (3 - 2 * fade) * Math.min(.9, intensity / 200);
      context.fillStyle = `rgba(${r},${g},${b},${opacity})`;
      context.fillRect(x, y, 3, 3);
    }
  }
  if (preference.matches) {
    draw(1);
    return;
  }
  const start = Math.max(performance.now(), rolloutStart + 15700);
  function animate(now) {
    const progress = Math.min(1, Math.max(0, (now - start) / 45000));
    draw(progress);
    if (progress < 1) requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
};

const preference = matchMedia('(prefers-reduced-motion: reduce)');
if (!preference.matches && 'IntersectionObserver' in window) {
  document.querySelectorAll('[data-delay]').forEach(line => {
    const start = Number(line.dataset.delay);
    const letters = line.hasAttribute('data-letters');
    const label = line.textContent.trim();
    const words = letters ? [...label] : [label];
    const step = Number(line.dataset.step ?? .64);

  let targetY = 0;
  let currentX = 0;
  let currentY = 0;
  let currentScroll = 0;
  let frame = 0;
  let lastTime = 0;
  function draw(now) {
    frame = 0;
    if (preference.matches) return;
    const elapsed = lastTime ? Math.min(now - lastTime, 64) : 16;
    lastTime = now;
    const easing = 1 - Math.exp(-elapsed / 360);
    const targetScroll = Math.min(window.scrollY, scene.offsetHeight) * .32;
    currentX += (targetX - currentX) * easing;
    currentY += (targetY - currentY) * easing;
    currentScroll += (targetScroll - currentScroll) * easing;
    scene.style.setProperty('--x', currentX + 'px');
    scene.style.setProperty('--y', currentY + 'px');
    scene.style.setProperty('--scroll', currentScroll + 'px');
    const remaining = Math.abs(targetX - currentX) + Math.abs(targetY - currentY) + Math.abs(targetScroll - currentScroll);
