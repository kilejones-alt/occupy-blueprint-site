:root {
  color-scheme: dark;
  --ink: #040405;
  --paper: #f3f5f8;
  --oxblood: #a51d33;
  --gutter: clamp(22px, 5vw, 90px);
  --x: 0px;
  --y: 0px;
  --scroll: 0px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: system-ui, sans-serif;
}
main {
  overflow: clip;
  min-height: 114svh;
  position: relative;
  isolation: isolate;
  padding: clamp(36px, 7vh, 84px) var(--gutter) clamp(86px, 15vh, 180px);
}
h1, p, figure, blockquote { margin: 0; }
.title {
  width: min(100%, 1100px, 124svh);
  container-type: inline-size;
}
h1 { font-weight: 400; line-height: 1; }
.frame {
  display: block;
  overflow: hidden;
  transition: transform .85s cubic-bezier(.2,.7,.2,1), filter 1.2s ease;
}
.the {
  margin-bottom: clamp(12px, 1.6vw, 24px);
  font-size: clamp(19px, 2vw, 30px);
  font-weight: 450;
  letter-spacing: .22em;
}
.occupy {
  font-family: 'Barlow Condensed', Impact, sans-serif;
  font-size: 36cqw;
  font-weight: 800;
  letter-spacing: -.015em;
  line-height: .85;
  padding-bottom: .055em;
}
.occupy .word { display: block; }
.lettering {
  display: block;
  color: transparent;
  background:
    linear-gradient(116deg, transparent 0 23%, #101114 23.05% 23.17%, transparent 23.23%),
    linear-gradient(73deg, transparent 0 58%, #101114 58.05% 58.16%, transparent 58.23%),
    linear-gradient(131deg, transparent 0 83%, #151619 83.05% 83.14%, transparent 83.21%),
    radial-gradient(ellipse at var(--light-x, 35%) var(--light-y, 20%), #fff 0%, #edf0f3 48%, #d8dfe5 100%);
  background-clip: text;
  -webkit-background-clip: text;
}
.blueprint {
  margin-top: clamp(10px, 1.2vw, 22px);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20.6cqw;
  letter-spacing: .12em;
  line-height: .93;
  color: #f3f5f8;
}
.credit {
  margin-top: clamp(19px, 2.4vw, 36px);
  font: 400 clamp(11px, 1.2vw, 17px)/1.5 ui-monospace, monospace;
  letter-spacing: .085em;
  text-transform: uppercase;
  color: #d1d8e0;
}
.night-field {
  position: absolute;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  overflow: hidden;
  mask-image: linear-gradient(transparent 2%, #000 24%, #000 62%, transparent 100%);
}
.night {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
  pointer-events: none;
  opacity: .84;
  filter: blur(1.2px);
  transform-origin: 0 50%;
  transform: translate3d(calc(8vw + var(--x)), calc(var(--y) + var(--scroll)), 0) scale(1.375);
  will-change: transform;
}
.street {
  position: absolute;
  z-index: -1;
  inset: 8% 0 auto auto;
  width: 32%;
  height: 75%;
  overflow: hidden;
  opacity: .14;
  mask-image: radial-gradient(ellipse at 100% 40%, #000 10%, transparent 72%);
}
.street::after, .opening::after {
  content: '';
  position: absolute;
  inset: -12%;
  background: url(cover.webp) right center / auto 420% no-repeat;
  filter: grayscale(1) brightness(1.4) blur(1.2px);
  transform: translate3d(calc(var(--x) * .45), calc(var(--y) * .45 + var(--scroll) * .45), 0);
}
.opening {
  position: absolute;
  inset: 0 0 auto;
  height: 100svh;
  overflow: hidden;
  pointer-events: none;
  background: var(--ink);
  z-index: 2;
  animation: fade 5.4s .15s both;
  mask-image: linear-gradient(90deg, #000 77%, transparent);
}
.opening::after {
  background-size: auto 360%;
  background-position: 100% 55%;
  opacity: .8;
}
.statement {
  position: relative;
  isolation: isolate;
  margin-top: clamp(32px, 5.2svh, 62px);
}
.statement::before {
  content: '';
  position: absolute;
  inset: -45% -12% -55% -18%;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse at 31% 45%, rgb(4 4 5 / 58%) 14%, rgb(4 4 5 / 27%) 40%, transparent 71%);
}
.tagline {
  font-size: clamp(25px, 4.3vw, 68px);
  font-weight: 450;
  letter-spacing: -.045em;
  word-spacing: .04em;
  line-height: 1.2;
}
.second-line {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0 .24em;
  margin-top: .12em;
}
.tagline strong {
  color: var(--oxblood);
  font-weight: inherit;
  white-space: nowrap;
  display: inline-block;
}
.token {
  display: inline-block;
  overflow: hidden;
  vertical-align: baseline;
  padding: 4px 3px .09em;
  margin: -4px -3px 0;
  transition: transform .85s cubic-bezier(.2,.7,.2,1), filter 1.2s ease;
}
.hover-word {
  display: inline-block;
  transition: transform .85s cubic-bezier(.2,.7,.2,1), filter 1.2s ease, color 1.2s ease;
}
.word { display: inline-block; }
.js [data-reveal]:not(.revealed) .word { opacity: 0; }
.revealed .word { animation: roll 1.7s cubic-bezier(.18,.7,.24,1) var(--at, 0s) backwards; }
.tagline .revealed .word { animation: wave 1.6s cubic-bezier(.18,.7,.24,1) var(--at, 0s) backwards; }
.tagline strong.revealed .word { animation: roll 2.6s cubic-bezier(.2,.65,.25,1) var(--at, 0s) backwards; }
a {
  display: inline-block;
  margin-top: clamp(22px, 3svh, 36px);
  color: inherit;
  position: relative;
  text-decoration: none;
  font: 400 14px ui-monospace, monospace;
  transition: color 1s ease, transform .85s ease;
}
a::after {
  content: '';
  position: absolute;
  inset: auto 0 -.4em;
  height: 1px;
  background: currentColor;
  transform-origin: left;
}
.js .statement a:not(.revealed) { opacity: 0; }
.js .statement a.revealed { animation: roll .8s backwards; }
.js .statement a::after { transform: scaleX(0); }
.js .statement a.revealed::after { animation: underline 2.1s .3s cubic-bezier(.2,.65,.3,1) both; }
a:focus-visible { outline: 1px solid currentColor; outline-offset: .55em; }
.reading {
  padding: clamp(48px, 10vh, 130px) var(--gutter) clamp(90px, 15vh, 180px);
  min-height: 72svh;
}
.reading h2 {
  margin: 0 0 clamp(26px, 5vw, 70px);
  color: #bac2cb;
  font: 400 clamp(12px, 1.1vw, 16px)/1.5 ui-monospace, monospace;
  letter-spacing: .04em;
}
.reading blockquote {
  max-width: 1150px;
  font: 400 clamp(39px, 7vw, 108px)/1.05 'Barlow Condensed', sans-serif;
  letter-spacing: -.012em;
  text-wrap: balance;
}
.reading .attribution {
  margin-top: 28px;
  color: #bac2cb;
  font: 400 13px/1.5 ui-monospace, monospace;
}
.js .reading { opacity: 0; transform: translateY(34px); }
.js .reading.entered {
  opacity: 1;
  transform: none;
  transition: opacity 1.4s ease, transform 1.6s cubic-bezier(.2,.7,.2,1);
}
.js .reading a::after { transform: scaleX(0); }
.js .reading.entered a::after { animation: underline 2.1s .6s cubic-bezier(.2,.65,.3,1) both; }
@media (hover: hover) {
  .frame:hover { transform: translateY(-3px); filter: brightness(1.07); }
  .token:not(:has(.hover-word)):hover, .hover-word:hover {
    transform: translateY(-2px);
    filter: brightness(1.14);
  }
  .hover-word:hover, a:hover { color: #fff; }
  .tagline strong .token:hover { color: #c43249; }
  a:hover { transform: translateY(-2px); }
}
@keyframes roll {
  from { transform: translateY(-105%); clip-path: inset(0 0 100%); opacity: 0; }
  to { transform: none; clip-path: inset(-5px); opacity: 1; }
}
@keyframes wave {
  0% { transform: translateY(-90%) rotateX(5deg); clip-path: inset(0 0 100%); filter: blur(2px); opacity: 0; }
  60% { filter: blur(.2px); opacity: 1; }
  100% { transform: none; clip-path: inset(-5px); filter: blur(0); opacity: 1; }
}
@keyframes underline { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes fade { 0%, 11% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
@media (max-width: 650px) {
  main { min-height: 100svh; padding-top: 10svh; padding-bottom: 13svh; }
  .street { width: 46%; }
  .statement { margin-top: 38px; }
  .reading { min-height: 65svh; }
}
@media (prefers-reduced-motion: reduce) {
  .frame, .token, .hover-word, a { transition: none; }
  .frame:hover, .token:not(:has(.hover-word)):hover, .hover-word:hover, a:hover { transform: none; }
  .opening { display: none; }
  .js [data-reveal]:not(.revealed) .word, .js .statement a:not(.revealed) { opacity: 1; }
  .revealed .word, .tagline .revealed .word, .js .statement a, .js .statement a::after, .js .reading.entered a::after { animation: none; }
  .street::after { transform: none; }
  .js .reading { opacity: 1; transform: none; transition: none; }
  .js .reading a::after { transform: none; }
}

</style>
</head>
<body>
<main>
<div class="night-field" aria-hidden="true"><canvas class="night"></canvas></div>
<section class="hero run" aria-label="The Occupy Blueprint">

<script>
const preference = matchMedia('(prefers-reduced-motion: reduce)');
let lightsRequested = false;
let beginLights = null;
function requestLights() {
  lightsRequested = true;
  if (beginLights) beginLights();
}
const canvas = document.querySelector('.night');
const photograph = new Image();
photograph.onload = () => {
  const context = canvas.getContext('2d');
  if (!context) return;
  const w = canvas.width = 1200;
  const h = canvas.height = 800;
  function paintPhotograph() {
    context.save();
    context.translate(w / 2, h / 2);
    context.rotate(-Math.PI / 2);
    context.beginPath();
    context.moveTo(-h / 2, -w / 2);
    context.lineTo(h / 2, -w / 2);
    for (const [x, y] of [[1,.30],[.8,.40],[.65,.48],[.5,.54],[.35,.57],[0,.57]]) {
      context.lineTo((x - .5) * h, (y - .5) * w);
    }
    context.closePath();
    context.clip();
    context.drawImage(photograph, -h / 2, -w / 2, h, w);
    context.restore();
  }
  paintPhotograph();
  const pixels = context.getImageData(0, 0, w, h).data;
  context.clearRect(0, 0, w, h);

  const lights = [];
  for (let y = 2; y < h; y += 2) {
    for (let x = 2; x < w; x += 2) {
      const i = (y * w + x) * 4;
      const [r, g, b] = [pixels[i], pixels[i + 1], pixels[i + 2]];
      const intensity = .3 * r + .59 * g + .11 * b;
      if (intensity < 70) continue;
      const distance = Math.hypot((x - w * .65) * .85, y - h * .69);
      const offset = ((x * 47 + y * 31) % 61) - 30;
      lights.push({x, y, r, g, b, intensity, order: distance + offset});
    }
  }
  lights.sort((a, b) => a.order - b.order);
  function draw(progress) {
    context.clearRect(0, 0, w, h);
    const count = lights.length;
    for (let index = 0; index < count; index++) {
      const onset = index / count * .94;
      const fade = Math.min(1, Math.max(0, (progress - onset) / .06));
      if (fade <= 0) break;
      const {x, y, r, g, b, intensity} = lights[index];
      const brightness = Math.min(.72, intensity / 225);
      const opacity = fade * fade * (3 - 2 * fade) * brightness;
      context.fillStyle = `rgba(${r},${g},${b},${opacity})`;
      context.beginPath();
      context.arc(x, y, .9, 0, Math.PI * 2);
      context.fill();
    }
  }
  if (preference.matches) {
    draw(1);
    return;
  }
  let started = false;
  beginLights = () => {
    if (started) return;
    started = true;
    const start = performance.now();
    let lastPaint = 0;
    function animate(now) {
      const progress = Math.min(1, (now - start) / 20000);
      if (now - lastPaint >= 32 || progress === 1) {
        draw(progress);
        lastPaint = now;
      }
      if (progress < 1) requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  };
  if (lightsRequested) beginLights();
};

    if (!frame) {
      lastTime = 0;
      frame = requestAnimationFrame(draw);
    }
  }
  scene.addEventListener('pointermove', event => {
    if (event.pointerType !== 'mouse' && event.pointerType !== 'pen') return;
    targetX = (.5 - event.clientX / innerWidth) * Math.min(innerWidth * .09, 130);
    targetY = (.5 - event.clientY / innerHeight) * 80;
    schedule();
  });
  scene.addEventListener('pointerleave', () => {
    targetX = 0;
    targetY = 0;
    schedule();
  });
  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule);
  preference.addEventListener('change', () => {
    if (preference.matches) {
      cancelAnimationFrame(frame);
      frame = 0;
      scene.style.setProperty('--x', '0px');
      scene.style.setProperty('--y', '0px');
      scene.style.setProperty('--scroll', '0px');
    } else {
      schedule();
    }
  });
  schedule();
}
</script>
</body>
</html>
